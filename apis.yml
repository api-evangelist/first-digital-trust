apis:
- aid: first-digital-trust-open-trust-apis
  name: Open Trust APIs
  description: 'First Digital''s RESTful API suite for programmatic access to its trust and custody
    data and services. The provider''s product page describes seven capability areas: client
    onboarding (business and individual client onboarding, entity and service setup), KYC and assured
    identity (on-demand access to AML/CTF data and documents), account information (client and account
    lists, detailed real-time account information), instruction initiation (letting First Digital
    Trust clients initiate instructions from a third-party digital environment), reporting (real-time
    balances and reporting, plus retrieval of years of detailed transaction histories), webhooks
    (notification sync and automated responses across applications and accounts), and an
    authentication service (SSO login for enterprise apps). No public reference, developer portal, or
    machine-readable specification is published; the only call to action on the product page is
    "Become a Client".'
