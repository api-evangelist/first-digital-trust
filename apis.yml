aid: first-digital-trust
name: First Digital Trust
description: 'First Digital Trust Limited (trading as First Digital) is a Hong Kong-headquartered,
  technology-driven trust and custody institution serving the digital asset industry — blockchain
  startups, money service businesses, exchanges and token issuers. It provides multi-asset trust and
  custody across major fiat currencies, digital assets and securities, plus fiat gateways, settlement
  and clearing, payments rails, accounting and compliance infrastructure. It markets a developer-facing
  product, "Open Trust APIs" — an industry-standard RESTful API suite covering client onboarding,
  KYC/AML data access, account information, instruction initiation, reporting, webhooks and an SSO
  authentication service — but publishes no public developer portal, API reference or machine-readable
  specification; API access is reached through a client relationship. The firm is licensed as a Trust
  or Company Service Provider in Hong Kong (TC006771) and registered under section 78(1) of the
  Trustee Ordinance (Cap. 29), and is SOC 1 Type 2, SOC 2 Type 2 and ISO 27001 certified.'
